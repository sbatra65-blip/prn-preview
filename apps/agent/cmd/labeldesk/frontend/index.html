<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabelDesk</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#f9fafb;font:16px/1.5 system-ui,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:20px;font-weight:600;margin:0 0 8px}p{margin:0 0 20px;color:#d1d5db;max-width:360px}
button{min-height:44px;padding:0 20px;border:0;border-radius:8px;background:#f97316;color:#111827;font:600 16px system-ui,"Segoe UI",sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#off{display:none}
</style>
</head>
<body>
<main id="wait"><p>Opening LabelDesk…</p></main>
<main id="off"><h1>LabelDesk can't reach the internet</h1><p>Check Wi-Fi or the network cable, then try again. Printing through the built-in Print Agent keeps working for other programs.</p><button type="button" id="again">Try again</button></main>
<script>
const SITE = "https://labeldesk.app/?app=wingo";
function go() {
  document.getElementById("off").style.display = "none"; document.getElementById("wait").style.display = "block";
  const c = new AbortController(), t = setTimeout(() => c.abort(), 8000);
  fetch("https://labeldesk.app/manifest.webmanifest", { mode: "no-cors", cache: "no-store", signal: c.signal })
    .then(() => location.replace(SITE))
    .catch(() => { document.getElementById("wait").style.display = "none"; document.getElementById("off").style.display = "block"; document.getElementById("again").focus(); })
    .finally(() => clearTimeout(t));
}
document.getElementById("again").onclick = go;
go();
</script>
</body>
</html>
